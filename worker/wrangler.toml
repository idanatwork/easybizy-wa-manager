name = "wa-manager"
main = "src/index.js"
compatibility_date = "2026-11-23"

# Static console origin allowed to call this API (the GitHub Pages site).
[vars]
ALLOWED_ORIGIN = "https://idanatwork.github.io"
# OAuth 2.0 web client ID from Google Cloud Console (not a secret, but keep it here).
GOOGLE_CLIENT_ID = "560597118963-pf9ng7eiibfqjsseipi7nqlabpvn83a5.apps.googleusercontent.com"
# Comma-separated Google emails allowed to sign in. Server-side allowlist.
ALLOWED_EMAILS = "idanatwork@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "wa-manager"
database_id = "REPLACE_WITH_D1_ID"   # from: wrangler d1 create wa-manager
