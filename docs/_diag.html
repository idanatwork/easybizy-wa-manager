<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out">pending</pre>
<script>
const pages = ['overview','campaigns','funnel','attention','messages','systems'];
const widths = [390, 360];
const out = [];
let done = 0, total = pages.length * widths.length;
function measure(page, w) {
  const f = document.createElement('iframe');
  f.style.cssText = `width:${w}px;height:700px;border:0;position:absolute;left:-2000px;top:0`;
  f.src = '/index.html#/board/' + page;
  f.onload = () => setTimeout(() => {
    try {
      const d = f.contentDocument, win = f.contentWindow;
      const de = d.documentElement;
      const sw = de.scrollWidth, cw = de.clientWidth;
      const bad = [];
      if (sw > cw) {
        d.querySelectorAll('*').forEach(el => {
          const r = el.getBoundingClientRect();
          if (r.right > cw + 1 || r.left < -1) {
            const cls = (el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className || '').toString().slice(0, 40);
            bad.push(`${el.tagName}.${cls} L${Math.round(r.left)} R${Math.round(r.right)}`);
          }
        });
      }
      out.push(`${page}@${w}: scrollWidth=${sw} clientWidth=${cw} ${sw > cw ? 'OVERFLOW' : 'ok'}` + (bad.length ? '\n  ' + bad.slice(0, 12).join('\n  ') : ''));
    } catch (e) { out.push(`${page}@${w}: ERR ${e.message}`); }
    document.getElementById('out').textContent = out.join('\n');
    if (++done === total) document.getElementById('out').textContent += '\nALL-DONE';
  }, 1500);
  document.body.appendChild(f);
}
pages.forEach(p => widths.forEach(w => measure(p, w)));
</script></body></html>
