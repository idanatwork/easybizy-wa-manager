<!doctype html><html><body style="margin:0">
<iframe src="/index.html#/board/fieldmap" style="width:390px;height:3000px;border:0" onload="tick(this,'fm390')"></iframe>
<iframe src="/index.html#/board/fieldmap" style="width:360px;height:3000px;border:0" onload="tick(this,'fm360')"></iframe>
<iframe src="/index.html#/board/workplan" style="width:390px;height:4200px;border:0" onload="tick(this,'wp390')"></iframe>
<iframe src="/index.html#/board/workplan" style="width:360px;height:4200px;border:0" onload="tick(this,'wp360')"></iframe>
<pre id="out">measuring...</pre>
<script>
const R={};let n=0;
function tick(f,k){n++;
  const f2=()=>{const d=f.contentDocument;R[k]={sw:d.documentElement.scrollWidth,cw:d.documentElement.clientWidth};
    if(n===4)document.getElementById('out').textContent=JSON.stringify(R);};
  f.contentWindow.requestAnimationFrame(()=>f.contentWindow.requestAnimationFrame(f2));
}
</script></body></html>
